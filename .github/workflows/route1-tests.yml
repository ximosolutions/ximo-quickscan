name: Route 1 regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Route 1 regression tests
        run: node --experimental-default-type=module --test tests/*.mjs
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js; do node --experimental-default-type=module --check "$file"; done
