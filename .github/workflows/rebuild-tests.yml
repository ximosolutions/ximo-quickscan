name: Quickscan V3 rebuild tests
on:
  push:
    branches:
      - rebuild/clean-quickscan-v3
  pull_request:
    paths:
      - 'rebuild/**'
      - '.github/workflows/rebuild-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
